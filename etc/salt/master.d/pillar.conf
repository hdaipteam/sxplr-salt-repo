# /etc/salt/master.d/pillar.conf

# ext_pillar:
#   - vault: salt/sxplr

  # Hinweis:
# Die eigentliche Vault-Konfiguration (URL, Auth, mount_point, kv_version, etc.)
# kommt aus /etc/salt/master.d/vault.conf.
#
# Die Zugriffs-ACL wird primär über Vault-Policies geregelt.
# Wenn du später minion-spezifische Pillar-Daten aus Vault ziehen willst,
# empfiehlt sich ein Schema wie (KV v2, Mount "salt"):
#
#   salt/data/sxplr/minion/%(minion_id)s
#
# und dazu passende Policies, z.B.
#
#   path "salt/data/sxplr/minion/{{identity.entity.name}}" { ... }

  # Hier kann die Minion-ACL definiert werden, um später den Zugriff zu beschränken.
  # Beispiel-ACL: 'secret/data/salt/minion/%(minion_id)s'
#   