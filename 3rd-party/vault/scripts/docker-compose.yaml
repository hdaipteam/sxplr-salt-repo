# docker-compose.yaml
services:
  vault:
    image: hashicorp/vault:1.21.1
    container_name: sxplr-vault-001
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      # Nur für Clients (UI, curl), NICHT Listener!
      VAULT_ADDR: "http://10.99.0.1:8200"
      VAULT_LOCAL_CONFIG: |
        {
          "ui": true,
          "log_level": "info",
          "disable_mlock": true,
          "api_addr": "http://10.99.0.1:8200",
          "cluster_addr": "http://10.99.0.1:8201",
          "cluster_name": "sxplr-vault-cluster",
          "listener": [
            {
              "tcp": {
                "address": "0.0.0.0:8200",
                "tls_disable": 1
              }
            }
          ],
          "storage": {
            "file": {
              "path": "/vault/file"
            }
          }
        }
    ports:
      - "8200:8200"
    volumes:
      - /data/vault/config:/vault/config
      - /data/vault/file:/vault/file
      - /data/vault/logs:/vault/logs
      - /data/vault/certs:/vault/certs
    # command: "server -config=/vault/config/vault.hcl"
    command: "server"
