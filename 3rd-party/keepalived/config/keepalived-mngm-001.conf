vrrp_script chk_salt {
    script "/etc/keepalived/check_salt.sh"
    interval 3
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state MASTER
    interface wg0
    virtual_router_id 51
    priority 150
    advert_int 1

    unicast_src_ip 10.99.0.1
    unicast_peer {
        10.99.0.2
    }

    authentication {
        auth_type PASS
        auth_pass supersecretpassword
    }

    virtual_ipaddress {
        10.99.0.10
    }

    track_script {
        chk_salt
    }
}
